user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No IP addresses, user agents or referrers in the access log: visitors are
    # mostly minors and nothing here needs to know who made a request.
    log_format privacy '[$time_local] "$request" $status $body_bytes_sent';

    access_log /var/log/nginx/access.log privacy;
    server_tokens off;

    # API limit is per client (forwarded address); the login limit is site-wide
    limit_req_zone $http_x_forwarded_for$remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;  # site-wide: only a few admins
    limit_req_zone $http_x_forwarded_for$remote_addr zone=questions:10m rate=3r/m;
    limit_req_status 429;

    # Caching by response class. Fonts have content hashes in their names, so
    # they can be cached for a year. Pages, CSS and crawl files are revalidated
    # on every load (new deploys and deletions show up immediately). An empty
    # value means no header at all, which is what /api/ responses get: their
    # caching is unchanged here and is a separate, reviewed proposal.
    map $uri $static_cache_control {
        default                    "";
        ~^/fonts/.+\.woff2$         "public, max-age=31536000, immutable";
        ~\.(html|css|txt|xml)$      "no-cache";
    }

    # Keep review drafts and internal pages out of search results. This only
    # affects indexing; it is not access control.
    map $uri $robots_tag {
        default            "";
        /terms-draft.html  "noindex, nofollow";
        /admin.html        "noindex, nofollow";
        /demo.html         "noindex, nofollow";
        /404.html          "noindex";
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    gzip on;

    server {
        listen 80;
        server_name _;

        # Serve static HTML/assets
        root /app/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # Set at server level (never inside a location) so every response keeps
        # the security headers above: a location with its own add_header would
        # silently drop all of them.
        add_header Cache-Control $static_cache_control always;
        add_header X-Robots-Tag $robots_tag always;

        # Unknown paths get a real 404 page, not the app with a 200.
        error_page 404 /404.html;
        location = /404.html { internal; }

        location = /api/admin/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/questions {
            limit_req zone=questions burst=5 nodelay;
            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy API requests to Express server
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # The app lives at "/" (views are query parameters such as ?page=submit
        # or ?schools=UCs&college=…). Every other path is a real file or a 404.
        # This used to fall back to index.html for any path, so /robots.txt,
        # /sitemap.xml and typos all returned the home page with HTTP 200.
        location = / {
            try_files /index.html =404;
        }
        location / {
            try_files $uri =404;
        }
    }
}
